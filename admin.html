<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 益家企业门户</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4f8ef7;
      --primary-dark: #3a6fd8;
      --accent: #f7c948;
      --success: #34d399;
      --danger: #f87171;
      --bg: #0a0e1a;
      --bg2: #111827;
      --card: #1a2235;
      --border: #1e2d4a;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #64748b;
    }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 30px; padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 24px; display: flex; align-items: center; gap: 10px; }
    .header .badge {
      background: var(--primary); color: #fff; font-size: 12px;
      padding: 4px 10px; border-radius: 20px;
    }
    .sync-status { font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .sync-status .dot { width: 8px; height: 8px; border-radius: 50%; }
    .sync-status .dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .sync-status .dot.offline { background: var(--danger); }
    .sync-status .dot.loading { background: var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .tabs {
      display: flex; gap: 10px; margin-bottom: 24px;
      border-bottom: 1px solid var(--border); padding-bottom: 10px;
    }
    .tab {
      padding: 10px 20px; border-radius: 8px; cursor: pointer;
      background: transparent; border: none; color: var(--text2);
      font-size: 14px; transition: all .2s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--primary); color: #fff; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; margin-bottom: 20px;
    }
    .card-title {
      font-size: 16px; font-weight: 600; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%; padding: 10px 14px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none; border-color: var(--primary);
    }
    .form-textarea { min-height: 200px; resize: vertical; font-family: inherit; }
    .btn {
      padding: 10px 20px; border-radius: 8px; border: none;
      font-size: 14px; cursor: pointer; transition: all .2s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: #0a0e1a; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    .stat-value { font-size: 32px; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 13px; color: var(--text2); margin-top: 4px; }
    .employee-list { margin-top: 16px; }
    .employee-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: var(--bg2);
      border-radius: 8px; margin-bottom: 10px;
    }
    .employee-info { display: flex; align-items: center; gap: 12px; flex: 1; }
    .employee-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--primary); display: flex;
      align-items: center; justify-content: center;
      font-size: 16px; font-weight: 600; flex-shrink: 0;
    }
    .employee-name { font-weight: 500; }
    .employee-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .employee-actions { display: flex; align-items: center; gap: 8px; }
    .status-badge {
      padding: 4px 10px; border-radius: 20px; font-size: 12px;
    }
    .status-confirmed { background: rgba(52,211,153,.2); color: var(--success); }
    .status-pending { background: rgba(248,113,113,.2); color: var(--danger); }
    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text3);
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      padding: 14px 20px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--border);
      display: none; align-items: center; gap: 10px;
      animation: slideIn .3s ease; z-index: 9999;
    }
    .toast.show { display: flex; }
    .toast-success { border-color: var(--success); color: var(--success); }
    .toast-error { border-color: var(--danger); color: var(--danger); }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .qr-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8);
      align-items: center; justify-content: center; z-index: 1000;
    }
    .qr-modal.show { display: flex; }
    .qr-modal-content {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; text-align: center; max-width: 400px;
    }
    .qr-modal-content h3 { margin-bottom: 12px; }
    .qr-modal-content img { background: #fff; padding: 10px; border-radius: 8px; margin: 12px auto; }
    .qr-modal-content .url { font-size: 11px; color: var(--text3); word-break: break-all; background: var(--bg2); padding: 8px; border-radius: 6px; margin-top: 10px; }
    .password-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.9);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .password-modal.hidden { display: none; }
    .password-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px; width: 100%; max-width: 360px; text-align: center;
    }
    .password-card h2 { margin-bottom: 8px; }
    .password-card p { color: var(--text2); font-size: 14px; margin-bottom: 20px; }
    .main-content.hidden { display: none; }
    .last-sync { font-size: 11px; color: var(--text3); margin-left: 8px; }
  </style>
</head>
<body>
  <!-- 密码验证 -->
  <div class="password-modal" id="passwordModal">
    <div class="password-card">
      <div style="font-size:48px;margin-bottom:12px;">🔒</div>
      <h2>管理后台</h2>
      <p>请输入管理密码</p>
      <input type="password" class="form-input" id="adminPassword" placeholder="密码" style="margin-bottom:16px;" onkeypress="if(event.key==='Enter')checkPassword()">
      <button class="btn btn-primary" style="width:100%;" onclick="checkPassword()">进入后台</button>
    </div>
  </div>

  <div class="container main-content hidden" id="mainContent">
    <div class="header">
      <h1>🏠 益家企业门户 <span class="badge">管理后台</span></h1>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="sync-status" id="syncStatus">
          <span class="dot loading"></span>
          <span class="sync-text">连接中...</span>
        </span>
        <span class="last-sync" id="lastSync"></span>
        <button class="btn btn-sm" id="btn-token" style="background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:11px;" onclick="showTokenConfig()">⚙️ 同步设置</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('dashboard')">📊 数据概览</button>
      <button class="tab" onclick="switchTab('handbook')">📋 员工手册</button>
      <button class="tab" onclick="switchTab('employees')">👥 员工管理</button>
    </div>

    <!-- 数据概览 -->
    <div class="panel active" id="panel-dashboard">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="stat-total">-</div>
          <div class="stat-label">总员工数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-confirmed" style="color:var(--success);">-</div>
          <div class="stat-label">已确认手册</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-pending" style="color:var(--danger);">-</div>
          <div class="stat-label">待确认</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">📈 最近入职</div>
        <div id="recent-list" class="employee-list">
          <div class="empty-state"><div style="color:var(--text3)">加载中...</div></div>
        </div>
      </div>
    </div>

    <!-- 员工手册 -->
    <div class="panel" id="panel-handbook">
      <div class="card">
        <div class="card-title">📝 编辑员工手册</div>
        <div class="form-group">
          <label class="form-label">手册标题</label>
          <input type="text" class="form-input" id="handbook-title" value="员工手册">
        </div>
        <div class="form-group">
          <label class="form-label">手册内容（支持 HTML）</label>
          <textarea class="form-textarea" id="handbook-content" placeholder="支持 &lt;h3&gt;标题&lt;/h3&gt;、&lt;p&gt;段落&lt;/p&gt;、&lt;ul&gt;&lt;li&gt;列表项&lt;/li&gt;&lt;/ul&gt;"></textarea>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-primary" id="btn-save-handbook" onclick="saveHandbook()">💾 保存手册</button>
          <button class="btn" onclick="previewHandbook()" style="background:var(--bg2);border:1px solid var(--border);">👁️ 预览</button>
          <span id="handbook-save-status" style="font-size:12px;color:var(--text3);"></span>
        </div>

        <!-- 预览区域 -->
        <div id="handbook-preview-container" style="margin-top:24px;display:none;">
          <label class="form-label">预览效果</label>
          <div class="handbook-preview" id="handbook-preview" style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:28px 32px;max-height:420px;overflow-y:auto;line-height:1.9;font-size:14px;">
          </div>
        </div>
      </div>
    </div>

    <!-- 员工管理 -->
    <div class="panel" id="panel-employees">
      <div class="card">
        <div class="card-title">➕ 添加新员工</div>
        <div class="row">
          <div class="form-group">
            <label class="form-label">姓名 *</label>
            <input type="text" class="form-input" id="emp-name" placeholder="员工姓名">
          </div>
          <div class="form-group">
            <label class="form-label">身份证号</label>
            <input type="text" class="form-input" id="emp-idcard" placeholder="身份证号码">
          </div>
          <div class="form-group">
            <label class="form-label">手机号</label>
            <input type="text" class="form-input" id="emp-phone" placeholder="手机号码">
          </div>
          <div class="form-group">
            <label class="form-label">部门</label>
            <select class="form-input" id="emp-dept">
              <option value="采购部">采购部</option>
              <option value="摄影部">摄影部</option>
              <option value="综合行政部">综合行政部</option>
              <option value="跨境部">跨境部</option>
            </select>
          </div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-success" id="btn-add-emp" onclick="addEmployee()">➕ 添加员工</button>
          <span id="emp-save-status" style="font-size:12px;color:var(--text3);"></span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">👥 员工列表 <span id="emp-count" style="font-size:12px;color:var(--text3);font-weight:400;"></span></div>
        <div id="employee-list">
          <div class="empty-state"><div style="color:var(--text3)">加载中...</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 二维码弹窗 -->
  <div class="qr-modal" id="qrModal" onclick="if(event.target===this)closeQrModal()">
    <div class="qr-modal-content">
      <h3 id="qr-emp-name">员工二维码</h3>
      <div id="qr-image"></div>
      <div class="url" id="qr-url"></div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="closeQrModal()">关闭</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Token 配置弹窗 -->
  <div class="qr-modal" id="tokenModal" onclick="if(event.target===this)closeTokenModal()">
    <div class="qr-modal-content" style="max-width:420px;">
      <h3 style="margin-bottom:12px;">⚙️ 云端同步设置</h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:16px;">填入 GitHub Token 后，点击"保存手册"或"添加员工"会自动同步到云端。</p>
      <div class="form-group">
        <label class="form-label">GitHub Token</label>
        <input type="password" class="form-input" id="token-input" placeholder="ghp_xxxxxxxxxxxx" style="font-size:13px;">
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" onclick="saveToken()">保存 Token</button>
        <button class="btn btn-primary" style="background:var(--success);" onclick="testToken()">测试连接</button>
        <button class="btn" style="background:var(--bg2);color:var(--text2);border:1px solid var(--border);" onclick="closeTokenModal()">取消</button>
      </div>
      <div id="token-msg" style="margin-top:12px;font-size:12px;color:var(--text3);"></div>
    </div>
  </div>

  <script>
    // ===== 云端配置 =====
    
    const DATA_RAW_URL = 'https://gkl888.github.io/enterprise-portal/data/portal-data.json';
    const DATA_API_URL = 'https://api.github.com/repos/gkl888/enterprise-portal/contents/data/portal-data.json';

    // 存储 key
    const LOCAL_KEY = 'yijia_portal_data';

    // 密码
    const ADMIN_PASSWORD = 'yijia2024';

    // 状态
    let cloudData = null;  // 云端数据
    let localData = null;  // 本地数据
    let fileSha = null;    // Gist SHA（更新时需要）

    // ===== GitHub Token =====
    // Token 存储在 localStorage，用户首次使用时配置
    const TOKEN_KEY = 'yijia_github_token';
    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || '';
    }  // 可选：填入 GitHub PAT 可开启写入功能

    // ===== 初始化 =====
    async function init() {
      updateSyncUI('loading', '连接中...');
      
      try {
        // 1. 尝试从云端加载
        cloudData = await loadFromCloud();
        localData = loadLocal();
        
        // 2. 合并数据：云端为主，本地为辅
        const merged = mergeData(localData, cloudData);
        localData = merged;
        saveLocal(localData);
        
        updateSyncUI('online', '云端已连接');
        render();
        
      } catch (e) {
        console.warn('云端加载失败，使用本地数据:', e);
        localData = loadLocal();
        if (!localData) {
          localData = { employees: [], handbook: { title: '员工手册', content: '' }, version: 1 };
        }
        updateSyncUI('offline', '离线模式');
        render();
      }
    }

    // ===== 云端读取 =====
    async function loadFromCloud() {
      const resp = await fetch(DATA_RAW_URL + '?t=' + Date.now());
      if (!resp.ok) throw new Error('云端读取失败 ' + resp.status);
      const data = await resp.json();
      // 迁移旧格式
      if (Array.isArray(data)) {
        data = { employees: data, handbook: { title: '员工手册', content: '' }, version: 1 };
      }
      return data;
    }

    // ===== 云端保存 =====
        async function saveToCloud(data) {
      const token = getToken();
      if (!token) {
        console.log('未配置 GitHub Token，仅保存本地');
        return;
      }
    
      try {
        // 先获取当前文件 SHA（必须，Contents API PUT 需要）
        const metaResp = await fetch(DATA_API_URL, {
          headers: { Authorization: 'token ' + token }
        });
        if (!metaResp.ok) {
          console.error('获取文件 SHA 失败:', metaResp.status);
          return;
        }
        const meta = await metaResp.json();
        const sha = meta.sha;

        const base64Content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
        const resp = await fetch(DATA_API_URL, {
          method: 'PUT',
          headers: {
            Authorization: 'token ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'update portal data',
            content: base64Content,
            sha: sha
          })
        });
        if (resp.ok) console.log('云端保存成功');
        else console.error('云端保存失败:', resp.status, await resp.text());
      } catch(e) {
        console.error('saveToCloud error:', e);
      }
    }

    // ===== 本地存储 =====
    function loadLocal() {
      return JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
    }

    function saveLocal(data) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
    }

    // ===== 数据合并 =====
    function mergeData(local, cloud) {
      if (!cloud) return local || { employees: [], handbook: { title: '员工手册', content: '' }, version: 1 };
      if (!local) return cloud;
      
      // 员工合并：云端为主，按 id 去重
      const cloudIds = new Set(cloud.employees.map(e => e.id));
      const uniqueLocal = local.employees.filter(e => !cloudIds.has(e.id));
      const employees = [...cloud.employees, ...uniqueLocal];
      
      return {
        ...cloud,
        employees,
        handbook: cloud.handbook?.content ? cloud.handbook : (local.handbook || { title: '员工手册', content: '' })
      };
    }

    // ===== UI 状态 =====
    function updateSyncUI(status, text) {
      const el = document.getElementById('syncStatus');
      el.innerHTML = `<span class="dot ${status}"></span><span class="sync-text">${text}</span>`;
    }

    // ===== 渲染 =====
    function render() {
      if (!localData) return;

      // 手册
      document.getElementById('handbook-title').value = localData.handbook?.title || '员工手册';
      document.getElementById('handbook-content').value = localData.handbook?.content || '';

      // 统计
      const confirmed = localData.employees.filter(e => e.handbookConfirmed).length;
      document.getElementById('stat-total').textContent = localData.employees.length;
      document.getElementById('stat-confirmed').textContent = confirmed;
      document.getElementById('stat-pending').textContent = localData.employees.length - confirmed;
      document.getElementById('emp-count').textContent = `（共 ${localData.employees.length} 人）`;

      // 员工列表
      renderEmployeeList();
      renderRecentList();

      // 最后同步时间
      if (cloudData) {
        document.getElementById('lastSync').textContent = '最后同步: ' + new Date().toLocaleTimeString();
      }
    }

    function renderEmployeeList() {
      const container = document.getElementById('employee-list');
      const emps = localData.employees;
      if (emps.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div>暂无员工数据</div></div>';
        return;
      }
      container.innerHTML = emps.map(emp => `
        <div class="employee-item">
          <div class="employee-info">
            <div class="employee-avatar">${emp.name.charAt(0)}</div>
            <div>
              <div class="employee-name">${emp.name}</div>
              <div class="employee-meta">${emp.dept || ''} · ${emp.phone || '无手机'}</div>
            </div>
          </div>
          <div class="employee-actions">
            <span class="status-badge ${emp.handbookConfirmed ? 'status-confirmed' : 'status-pending'}">
              ${emp.handbookConfirmed ? '✓ 已确认' : '待确认'}
            </span>
            <button class="btn btn-sm btn-primary" onclick="showQR('${emp.id}')">📱 二维码</button>
          </div>
        </div>
      `).join('');
    }

    function renderRecentList() {
      const container = document.getElementById('recent-list');
      const recent = localData.employees.slice(-5).reverse();
      if (recent.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div>暂无数据</div></div>';
        return;
      }
      container.innerHTML = recent.map(emp => `
        <div class="employee-item">
          <div class="employee-info">
            <div class="employee-avatar">${emp.name.charAt(0)}</div>
            <div>
              <div class="employee-name">${emp.name}</div>
              <div class="employee-meta">${emp.dept || ''} · ${emp.joinDate || ''}</div>
            </div>
          </div>
          <span class="status-badge ${emp.handbookConfirmed ? 'status-confirmed' : 'status-pending'}">
            ${emp.handbookConfirmed ? '✓ 已确认' : '待确认'}
          </span>
        </div>
      `).join('');
    }

    // ===== 切换标签 =====
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
    }

    // ===== 预览手册 =====
    function previewHandbook() {
      const title = document.getElementById('handbook-title').value;
      const content = document.getElementById('handbook-content').value;
      const previewContainer = document.getElementById('handbook-preview-container');
      const preview = document.getElementById('handbook-preview');
      
      // 将纯文本转换为 HTML，保留换行和段落格式
      let htmlContent = content
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .split('\n\n')
        .map(p => p.trim() ? '<p>' + p.replace(/\n/g, '<br>') + '</p>' : '')
        .join('');
      
      preview.innerHTML = '<h2 style="color:var(--primary);margin-bottom:20px;text-align:center;">' + title + '</h2>' + htmlContent;
      previewContainer.style.display = 'block';
      previewContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ===== 保存手册 =====
    async function saveHandbook() {
      const btn = document.getElementById('btn-save-handbook');
      const status = document.getElementById('handbook-save-status');
      btn.disabled = true;
      btn.textContent = '保存中...';
      status.textContent = '';

      try {
        localData.handbook = {
          title: document.getElementById('handbook-title').value,
          content: document.getElementById('handbook-content').value
        };
        saveLocal(localData);

        try {
          await saveToCloud(localData);
          status.textContent = '✅ 已同步云端';
        } catch {
          status.textContent = '✅ 已保存本地';
        }
        showToast('手册保存成功！', 'success');
      } catch (e) {
        showToast('保存失败', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '💾 保存手册';
      }
    }

    // ===== 添加员工 =====
    async function addEmployee() {
      const name = document.getElementById('emp-name').value.trim();
      if (!name) {
        showToast('请输入员工姓名', 'error');
        return;
      }

      const btn = document.getElementById('btn-add-emp');
      const status = document.getElementById('emp-save-status');
      btn.disabled = true;
      btn.textContent = '添加中...';
      status.textContent = '';

      try {
        const emp = {
          id: 'emp_' + Date.now(),
          name: name,
          idCard: document.getElementById('emp-idcard').value.trim(),
          phone: document.getElementById('emp-phone').value.trim(),
          dept: document.getElementById('emp-dept').value,
          joinDate: new Date().toISOString().split('T')[0],
          handbookConfirmed: false
        };

        localData.employees.push(emp);
        saveLocal(localData);

        try {
          await saveToCloud(localData);
          status.textContent = '✅ 已同步云端';
        } catch {
          status.textContent = '✅ 已保存本地';
        }

        // 清空表单
        document.getElementById('emp-name').value = '';
        document.getElementById('emp-idcard').value = '';
        document.getElementById('emp-phone').value = '';

        render();
        showToast('员工添加成功！', 'success');
      } catch (e) {
        showToast('添加失败', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '➕ 添加员工';
      }
    }

    // ===== 二维码 =====
    function showQR(empId) {
      const emp = localData.employees.find(e => e.id === empId);
      if (!emp) return;

      document.getElementById('qr-emp-name').textContent = emp.name + ' - 签署二维码';

      const baseUrl = location.origin + location.pathname.replace('admin.html', '');
      const signUrl = baseUrl + 'm-sign.html?id=' + emp.id + '&name=' + encodeURIComponent(emp.name) + '&dept=' + encodeURIComponent(emp.dept || '');
      const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(signUrl);

      document.getElementById('qr-image').innerHTML = '<img src="' + qrUrl + '" style="width:240px;height:240px;">';
      document.getElementById('qr-url').textContent = signUrl;
      document.getElementById('qrModal').classList.add('show');
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.remove('show');
    }

    // ===== 密码验证 =====
    function checkPassword() {
      const pwd = document.getElementById('adminPassword').value;
      console.log('输入密码:', pwd, '期望:', ADMIN_PASSWORD);
      if (pwd === ADMIN_PASSWORD) {
        document.getElementById('passwordModal').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        sessionStorage.setItem('admin_auth', 'true');
        init();
      } else {
        showToast('密码错误，请重新输入', 'error');
      }
    }

    if (sessionStorage.getItem('admin_auth') === 'true') {
      document.getElementById('passwordModal').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      init();
    }

    // ===== Token 配置 =====
    function showTokenConfig() {
      document.getElementById('token-input').value = getToken();
      document.getElementById('token-msg').textContent = '';
      document.getElementById('tokenModal').classList.add('show');
    }

    function closeTokenModal() {
      document.getElementById('tokenModal').classList.remove('show');
    }

    function saveToken() {
      const token = document.getElementById('token-input').value.trim();
      if (!token) {
        localStorage.removeItem(TOKEN_KEY);
        document.getElementById('token-msg').textContent = 'Token 已清除';
        return;
      }
      localStorage.setItem(TOKEN_KEY, token);
      document.getElementById('token-msg').textContent = '✅ Token 已保存';
      document.getElementById('token-msg').style.color = 'var(--success)';
      // 更新按钮状态
      if (token) {
        document.getElementById('btn-token').style.color = 'var(--success)';
        document.getElementById('btn-token').textContent = '✅ 已配置';
      }
    }

    async function testToken() {
      const token = document.getElementById('token-input').value.trim();
      const msg = document.getElementById('token-msg');
      if (!token) {
        msg.textContent = '请先输入 Token';
        msg.style.color = 'var(--danger)';
        return;
      }
      msg.textContent = '测试中...';
      msg.style.color = 'var(--text3)';
      try {
        const r = await fetch(DATA_API_URL, {
          headers: { Authorization: 'token ' + token }
        });
        if (r.ok) {
          msg.textContent = '✅ Token 有效！';
          msg.style.color = 'var(--success)';
          saveToken();
        } else {
          msg.textContent = '❌ Token 无效（' + r.status + '）';
          msg.style.color = 'var(--danger)';
        }
      } catch {
        msg.textContent = '❌ 网络错误';
        msg.style.color = 'var(--danger)';
      }
    }

    // ===== Toast =====
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast toast-' + type + ' show';
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
